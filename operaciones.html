<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaciones Básicas</title>
</head>
<body>
    <h1>Operaciones Básicas</h1>
    <script>
        let num1 = Number(prompt("Introduzca el primer numero"));
        let num2 = Number(prompt("Introduzca el segundo numero"));
        suma = num1 + num2;
        resta = num1 - num2;
        multi = num1 * num2;
        divi = num1 / num2;
        document.write("el valor es: " + suma + ", " + resta + ", " + multi + ", " + divi);
        alert("La suma resulto en: " + suma);
    </script>
</body>
</html>
