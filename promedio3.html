<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promedio</title>
</head>
<body>
    <h1>Promedio de 3 calificaciones</h1>
    <script>
        let cali1 = Number(prompt("Ingrese la calificacion 1"));
        let cali2 = Number(prompt("Ingrese la calificacion 2"));
        let cali3 = Number(prompt("Ingrese la calificacion 3"));
        let promedio = 0;

        suma = cali1 + cali2 + cali3;
        promedio = suma/3;

        document.write("Su promedio es de: " + promedio)
    </script>
</body>
</html>
