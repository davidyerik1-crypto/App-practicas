<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Ciclo For</h1>
    <script>
        for(i = 1; i<=5; i++){
            document.write("YErik" + "<br>");
        }
    </script>
    <h1>del 1 al 100</h1>
    <script>2
        for(i = 1; i<=100; i++){
            document.write(i + "<br>");
        }
    </script>
    <h1>del 100 al 1</h1>
    <script>
        for(i = 100; i>=1; i--){
            document.write(i + "<br>");
        }
    </script>
</body>
</html>
