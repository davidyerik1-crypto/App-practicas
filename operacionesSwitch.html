<body>
    <h1>Operaciones</h1>
    <script>
        let res1 = Number(prompt("Que operaciones deseas realizar? 1)Suma 2)Resta 3)Multiplicacion 4)Division"));
        let num1 = Number(prompt("Ingresa el primer número"));
        let num2 = Number(prompt("Ingresa el segundo número"));
        let resultado = 0;

        switch(res1){
            case 1:
                resultado = num1 + num2;
                document.write("El resultado de tu suma es: " + resultado);
            break;
            case 2:
                resultado = num1 - num2;
                document.write("El resultado de tu resta es: " + resultado);
            break;
            case 3:
                resultado = num1 * num2;
                document.write("El resultado de tu multiplicación es: " + resultado);
            break;
            case 4:
                resultado = num1 / num2;
                document.write("El resultado de tu división es: " + resultado);
            break;
            default:
                document.write("operacion invalida");
        }
    </script>
